# ChatGPT Ad Library scrape (internal inspiration vault only).
# Unlock + parse belong on the dedicated Vercel worker project
# (apps/chatgpt-ad-library-worker), not on app.adbot.one.
#
# Required in GitHub → Settings → Secrets and variables → Actions:
#   Secret CRON_SECRET     (= same value as Vercel CRON_SECRET, ≥32 chars)
#   Secret or Variable ADBOT_APP_URL  e.g. https://app.adbot.one  (no trailing slash)
# Optional:
#   Secret or Variable CHATGPT_AD_LIBRARY_WORKER_URL  e.g. https://adbot-chatgpt-ads.vercel.app
#   Secret SCRAPINGBEE_API_KEY  (only if the Action should unlock itself)
#
# Vercel env vars alone are NOT visible to this workflow.
#
# Apply migrations:
#   20260915140000_chatgpt_ad_library_crawl_state.sql
#   20260920120000_chatgpt_ad_library_skipped_ids.sql

name: ChatGPT Ad Library scrape

on:
  schedule:
    # Every 2 hours — backup if the dedicated Vercel worker is not deployed yet.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-ad-library-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require GitHub Actions secrets/vars
        env:
          ADBOT_APP_URL: ${{ secrets.ADBOT_APP_URL || vars.ADBOT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=0
          if [ -z "${ADBOT_APP_URL}" ]; then
            echo "::error::ADBOT_APP_URL fehlt in GitHub Actions. Anlegen unter: Repo → Settings → Secrets and variables → Actions → New repository secret (oder Variable) mit Name ADBOT_APP_URL, Wert z.B. https://app.adbot.one (ohne Slash). Vercel-Env reicht nicht."
            missing=1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET fehlt in GitHub Actions. Denselben Wert wie in Vercel hier anlegen: Repo → Settings → Secrets and variables → Actions → New repository secret → Name CRON_SECRET. Vercel-Env ist für diese Action unsichtbar."
            missing=1
          elif [ "${#CRON_SECRET}" -lt 32 ]; then
            echo "::error::CRON_SECRET muss mindestens 32 Zeichen haben (aktuell ${#CRON_SECRET})."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "ADBOT_APP_URL is set (length ${#ADBOT_APP_URL})"
          echo "CRON_SECRET is set (length ${#CRON_SECRET})"

      - name: Check dedicated worker
        id: worker
        env:
          CHATGPT_AD_LIBRARY_WORKER_URL: ${{ secrets.CHATGPT_AD_LIBRARY_WORKER_URL || vars.CHATGPT_AD_LIBRARY_WORKER_URL }}
        run: |
          if [ -n "${CHATGPT_AD_LIBRARY_WORKER_URL}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unlock via dedicated Vercel worker
        if: steps.worker.outputs.configured == 'true'
        env:
          CHATGPT_AD_LIBRARY_WORKER_URL: ${{ secrets.CHATGPT_AD_LIBRARY_WORKER_URL || vars.CHATGPT_AD_LIBRARY_WORKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          base="${CHATGPT_AD_LIBRARY_WORKER_URL%/}"
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w "%{http_code}" --max-time 280 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${base}/api/run?mode=run") || code="000"
          cat "$tmp"
          echo
          if [ "$code" != "200" ]; then
            echo "::warning::dedicated worker HTTP ${code} — Adbot Production was not used for unlock"
          fi

      - name: Check unlocker on Production (status only)
        id: unlocker
        if: steps.worker.outputs.configured != 'true'
        env:
          ADBOT_APP_URL: ${{ secrets.ADBOT_APP_URL || vars.ADBOT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          json=$(curl -sS -H "Authorization: Bearer ${CRON_SECRET}" \
            "${ADBOT_APP_URL}/api/cron/chatgpt-ad-library-scrape?mode=status")
          echo "$json"
          if [ -n "${SCRAPINGBEE_API_KEY}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unlock on GitHub runner
        if: steps.worker.outputs.configured != 'true' && steps.unlocker.outputs.configured == 'true'
        env:
          ADBOT_APP_URL: ${{ secrets.ADBOT_APP_URL || vars.ADBOT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          node apps/chatgpt-ad-library-worker/scripts/sync-shared.mjs
          node --experimental-strip-types scripts/chatgpt-ad-library-unlock-worker.mjs

      - name: Install Playwright
        if: steps.worker.outputs.configured != 'true' && steps.unlocker.outputs.configured != 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Scrape batch (≤5) and ingest
        if: steps.worker.outputs.configured != 'true' && steps.unlocker.outputs.configured != 'true'
        env:
          ADBOT_APP_URL: ${{ secrets.ADBOT_APP_URL || vars.ADBOT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/chatgpt-ad-library-scrape-playwright.mjs
