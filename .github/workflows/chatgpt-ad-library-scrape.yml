# Small recurring ChatGPT Ad Library scrape (internal inspiration vault only).
# Unlocker path drains the queue at full tempo. Playwright fallback stays ≤5
# (chatgptadlibrary.com guest page cap in a fresh browser).
#
# Required in GitHub → Settings → Secrets and variables → Actions:
#   Secret CRON_SECRET     (= same value as Vercel CRON_SECRET, ≥32 chars)
#   Secret or Variable ADBOT_APP_URL  e.g. https://app.adbot.one  (no trailing slash)
#
# Vercel env vars alone are NOT visible to this workflow.
#
# Required on Vercel Production for live HTML (GitHub runners hit the checkpoint):
#   SCRAPINGBEE_API_KEY   from https://www.scrapingbee.com/ (Freelance ~$50/mo)
# Optional on Vercel:
#   CHATGPT_AD_LIBRARY_UPLOADER_USER_ID  (site admin UUID)
# Apply migrations:
#   20260915140000_chatgpt_ad_library_crawl_state.sql
#   20260920120000_chatgpt_ad_library_skipped_ids.sql

name: ChatGPT Ad Library scrape

on:
  schedule:
    # Every 2 hours
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-ad-library-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require GitHub Actions secrets/vars
        env:
          # URL may be a Variable (preferred) or a Secret.
          ADBOT_APP_URL: ${{ secrets.ADBOT_APP_URL || vars.ADBOT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=0
          if [ -z "${ADBOT_APP_URL}" ]; then
            echo "::error::ADBOT_APP_URL fehlt in GitHub Actions. Anlegen unter: Repo → Settings → Secrets and variables → Actions → New repository secret (oder Variable) mit Name ADBOT_APP_URL, Wert z.B. https://app.adbot.one (ohne Slash). Vercel-Env reicht nicht."
            missing=1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET fehlt in GitHub Actions. Denselben Wert wie in Vercel hier anlegen: Repo → Settings → Secrets and variables → Actions → New repository secret → Name CRON_SECRET. Vercel-Env ist für diese Action unsichtbar."
            missing=1
          elif [ "${#CRON_SECRET}" -lt 32 ]; then
            echo "::error::CRON_SECRET muss mindestens 32 Zeichen haben (aktuell ${#CRON_SECRET})."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "ADBOT_APP_URL is set (length ${#ADBOT_APP_URL})"
          echo "CRON_SECRET is set (length ${#CRON_SECRET})"

      - name: Check unlocker
        id: unlocker
        env:
          ADBOT_APP_URL: ${{ secrets.ADBOT_APP_URL || vars.ADBOT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          json=$(curl -sS -H "Authorization: Bearer ${CRON_SECRET}" \
            "${ADBOT_APP_URL}/api/cron/chatgpt-ad-library-scrape?mode=status")
          echo "$json"
          if echo "$json" | grep -q '"unlockerConfigured":true'; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Unlocker is on Production. Never import Playwright in that path —
      # installing it is skipped, and a static `import "playwright"` crashes the job.
      - name: Unlock batch via Production
        if: steps.unlocker.outputs.configured == 'true'
        env:
          ADBOT_APP_URL: ${{ secrets.ADBOT_APP_URL || vars.ADBOT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          call() {
            local mode="$1"
            local max="$2"
            echo "=== ${mode} ==="
            local tmp
            tmp=$(mktemp)
            local code
            code=$(curl -sS -o "$tmp" -w "%{http_code}" --max-time "$max" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Accept: application/json" \
              "${ADBOT_APP_URL}/api/cron/chatgpt-ad-library-scrape?mode=${mode}") || code="000"
            cat "$tmp"
            echo
            if [ "$code" != "200" ]; then
              echo "::warning::${mode} HTTP ${code} (timeout or busy Production — no Vercel upgrade needed)"
              return 1
            fi
            if ! grep -q '"ok":true' "$tmp"; then
              echo "::warning::${mode} response is not ok"
              return 1
            fi
            return 0
          }
          # Short calls only. The cron route now kills itself at 120s —
          # a 180s curl used to leave an 800s drain running after timeout.
          call unlock_discover 90 || true
          call unlock 100 || true
          call unlock 100 || true
          call unlock 100 || true
          call unlock 100 || true

      - name: Install Playwright
        if: steps.unlocker.outputs.configured != 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Scrape batch (≤5) and ingest
        if: steps.unlocker.outputs.configured != 'true'
        env:
          ADBOT_APP_URL: ${{ secrets.ADBOT_APP_URL || vars.ADBOT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/chatgpt-ad-library-scrape-playwright.mjs
